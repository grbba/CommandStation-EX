; Optional display build; keep the standard project configuration unchanged.
[platformio]
extra_configs = platformio.ini

[env:Nucleo-F439ZI-Olimex]
extends = env:Nucleo-F439ZI
platform = ststm32 @ 19.7.1
lib_deps = ${env:Nucleo-F439ZI.lib_deps}
    adafruit/Adafruit ILI9341 @ 1.6.4
build_flags = ${env:Nucleo-F439ZI.build_flags} -DOLIMEX_LCD

; Compare without the display on the same available toolchain.
[env:Nucleo-F439ZI-DisplayDisabled]
extends = env:Nucleo-F439ZI
platform = ststm32 @ 19.7.1

; Standalone probe: replaces station firmware temporarily; no track control/WiFi.
[env:Nucleo-F439ZI-Olimex-Probe]
extends = env:Nucleo-F439ZI-Olimex
build_flags = ${env:Nucleo-F439ZI-Olimex.build_flags} -DOLIMEX_DISPLAY_PROBE
build_src_filter = -<*> +<tests/hardware/olimex_display_probe.cpp>

; Compatibility alias for the probe used to confirm the corrected wiring.
[env:Nucleo-F439ZI-Olimex-ProbeSwap]
extends = env:Nucleo-F439ZI-Olimex-Probe
